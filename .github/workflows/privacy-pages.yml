name: Privacy pages validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/account-deletion/**'
      - 'src/components/privacy/**'
      - 'src/components/footer.tsx'
      - 'src/app/sitemap.ts'
      - '.github/workflows/privacy-pages.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
